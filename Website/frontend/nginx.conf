# nginx site config for the Telco Churn SPA.
# Serves the built React app and reverse-proxies API calls to the Express
# backend container (compose service name: backend).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Reverse-proxy API traffic to the Express backend service.
    # A variable + Docker's embedded DNS (127.0.0.11) defers resolution to
    # request time, so nginx starts even if the backend container is not up
    # yet (it returns 502 until the backend becomes resolvable). This also lets
    # `nginx -t` pass outside a compose network.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream http://backend:4000;
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 2m;
    }

    # Long-cache immutable, content-hashed build assets.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: unknown paths resolve to index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}