# Docker Compose deployment for the Telco Churn MERN app.
#
# Builds the MERN images (telco-ml / telco-backend / telco-frontend) and wires
# them together behind an nginx reverse proxy.
#
# Quick start:
#   cp .env.example .env      # then set JWT_SECRET (and optionally the rest)
#   docker compose up --build
#   open http://localhost:${HTTP_PORT:-8080}
#
# Services:
#   mongo     -> MongoDB (persistent volume)
#   ml        -> Python FastAPI churn service (pinned model, /health + /predict)
#   backend   -> Express API (auth + validation + ML proxy)
#   frontend  -> nginx serving the built React SPA, proxying /api -> backend

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ml:
    build:
      context: "./ML Model"
      dockerfile: services/ml/Dockerfile
    image: telco-ml:${IMAGE_TAG:-latest}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status==200 else 1)",
        ]
      interval: 15s
      timeout: 6s
      retries: 10
      start_period: 40s

  backend:
    build:
      context: ./Website/backend
    image: telco-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      ml:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "4000"
      MONGODB_URI: mongodb://mongo:27017/telco_churn
      ML_SERVICE_URL: http://ml:8000
      ML_TIMEOUT_MS: "5000"
      CORS_ORIGIN: "${CORS_ORIGIN:-*}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set (copy .env.example to .env)}"
      JWT_EXPIRES_IN: "${JWT_EXPIRES_IN:-7d}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      AUTH_ADMIN_EMAIL: "${AUTH_ADMIN_EMAIL:-}"
      AUTH_ADMIN_PASSWORD: "${AUTH_ADMIN_PASSWORD:-}"
      AUTH_REQUIRED: "${AUTH_REQUIRED:-true}"
    expose:
      - "4000"

  frontend:
    build:
      context: ./Website/frontend
      args:
        VITE_GOOGLE_CLIENT_ID: "${VITE_GOOGLE_CLIENT_ID:-}"
    image: telco-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-8080}:80"

volumes:
  mongo-data: