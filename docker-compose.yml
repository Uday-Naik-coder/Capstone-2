# Docker Compose deployment for the Telco Churn app.
#
# ONE application image (React SPA + Express API + embedded Python ML model)
# plus MongoDB. Built from the repository root via the single root Dockerfile.
#
# Quick start:
#   cp .env.example .env      # then set JWT_SECRET (and optionally the rest)
#   docker compose up --build
#   open http://localhost:${HTTP_PORT:-8080}
#
# Services:
#   mongo -> MongoDB (persistent volume)
#   app   -> single container: built SPA (served by Express) + API + Python model

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: "${VITE_GOOGLE_CLIENT_ID:-}"
    image: udaynaik07/capstone-2:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "4000"
      MONGODB_URI: mongodb://mongo:27017/telco_churn
      # Embed FastAPI ML service as a child process on 127.0.0.1:8000 (/api/health waits for it)
      ML_EMBED: "1"
      ML_SERVICE_URL: http://127.0.0.1:8000
      ML_PORT: "8000"
      ML_TIMEOUT_MS: "5000"
      CORS_ORIGIN: "${CORS_ORIGIN:-*}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set (copy .env.example to .env)}"
      JWT_EXPIRES_IN: "${JWT_EXPIRES_IN:-7d}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      AUTH_ADMIN_EMAIL: "${AUTH_ADMIN_EMAIL:-}"
      AUTH_ADMIN_PASSWORD: "${AUTH_ADMIN_PASSWORD:-}"
      AUTH_REQUIRED: "${AUTH_REQUIRED:-true}"
    ports:
      - "${HTTP_PORT:-8080}:4000"

volumes:
  mongo-data: